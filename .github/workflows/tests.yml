name: Tests

on:
  push:
  pull_request:

jobs:
  # The toolkit-independent tests, which must pass without any GUI toolkit installed.
  headless:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  # The same tests with GTK 3 and a virtual display, so the GTK windows are exercised too.
  gtk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 librsvg2-common
      - name: Run the tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
